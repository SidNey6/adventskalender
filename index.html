<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventskalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="schnee" aria-hidden="true"></div>

  <header>
    <h1 id="titel">Adventskalender</h1>
    <p id="untertitel"></p>
  </header>

  <main>
    <p id="status" class="status">Lade Kalender …</p>
    <div id="kalender" class="kalender"></div>
  </main>

  <dialog id="dialog">
    <div class="dialog-inhalt">
      <h2 id="dialog-titel"></h2>
      <p id="dialog-text"></p>
      <button id="dialog-schliessen" type="button">Schließen</button>
    </div>
  </dialog>

  <footer>Ein Schulprojekt · Frohe Adventszeit!</footer>

  <script src="app.js"></script>
</body>
</html>
